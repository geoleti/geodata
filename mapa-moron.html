<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GeoData – Aeropuerto de Morón</title>

  <!-- Leaflet CSS -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />

  <style>
    :root {
      --bg:#0b1224;
      --ink:#e5e7eb;
      --muted:#9fb0cc;
    }
    * { box-sizing:border-box; }

    html, body {
      height:100%;
      margin:0;
      padding:0;
    }

    body {
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
      background:var(--bg);
      color:var(--ink);
      display:flex;
      flex-direction:column;
    }

    header {
      padding:10px 16px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      background:linear-gradient(135deg,#1e3c72,#2a5298);
      color:#fff;
      font-size:0.95rem;
      box-shadow:0 2px 10px rgba(0,0,0,.4);
      z-index:1000;
    }

    header a {
      color:#e5e7eb;
      text-decoration:none;
      opacity:.9;
    }
    header a:hover {
      opacity:1;
    }

    header h1 {
      margin:0;
      font-size:1.2rem;
      font-weight:600;
    }

    #map {
      width: 100%;
      height: 100%;
    }

    .subtitle {
      font-size:0.85rem;
      opacity:.85;
      margin-top:2px;
    }

    /* Contenedor que rota todo el mapa */
.map-container {
      flex: 1;
      width: 100%;
}


    .grilla-label {
      background: rgba(0,0,0,0.6);
      color: #fff;
      border-radius: 4px;
      padding: 2px 4px;
      border: none;
      font-size: 0.7rem;
    }
  </style>
</head>
<body>
  <header>
    <a href="mapas.html">← Volver a mapas</a>
    <div>
      <h1>Aeropuerto de Morón</h1>
      <div class="subtitle">Imagen satelital + grilla de análisis</div>
    </div>
  </header>

<div class="map-container">
  <iframe 
    width="100%" 
    height="100%" 
    allow="local-network-access; geolocation"
    title="Moron con grilla"
    src="https://www.arcgis.com/apps/mapviewer/index.html?configurableview=true&webmap=ed889683b55e41b783a7c89946c77452&theme=dark&heading=true&share=true&center=-58.641856111667366,-34.67688095263743&scale=18055.954822"
    style="border:0;">
  </iframe>
</div>


  <!-- Leaflet JS -->
  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin="">
  </script>

  <!-- Esri Leaflet (para mapa satelital) -->
  <script
    src="https://unpkg.com/esri-leaflet@3/dist/esri-leaflet.js"
    crossorigin="">
  </script>

  <!-- Script del mapa -->
  <script>
    // 1) Coordenadas aproximadas del Aeropuerto de Morón (fallback si falla la grilla)
    const centroMoron = [-34.674, -58.642]; // [lat, lon]

    // 2) Crear el mapa sin zoom fijo (lo ajustaremos con la grilla)
    const map = L.map('map');

    // 3) Mapa satelital (Esri Imagery)
    L.esri.basemapLayer('Imagery').addTo(map);

    // 4) Cargar la grilla de Morón desde capasjson/GrillaMoron.geojson
    fetch('capasjson/GrillaMoron.geojson')
      .then(response => {
        if (!response.ok) {
          throw new Error('No se pudo cargar GrillaMoron.geojson');
        }
        return response.json();
      })
      .then(data => {
        const grillaLayer = L.geoJSON(data, {
          style: function () {
            return {
              color: '#ffcc00',
              weight: 1,
              fillColor: '#ffcc00',
              fillOpacity: 0.12
            };
          },
          onEachFeature: function (feature, layer) {
            const props = feature.properties || {};
            const etiqueta = props.etiqueta || '';
            const id = props.id || props.ID || '';

            // Popup con info
            let contenido = '<strong>Celda de grilla</strong>';
            if (etiqueta) contenido += '<br>Etiqueta: ' + etiqueta;
            if (id) contenido += '<br>ID: ' + id;
            layer.bindPopup(contenido);

            // Etiqueta visible en el mapa (tooltip permanente)
            if (etiqueta) {
              layer.bindTooltip(etiqueta, {
                permanent: true,
                direction: 'center',
                className: 'grilla-label'
              });
            }
          }
        }).addTo(map);

        // 5) Ajustar la vista a la extensión de la grilla (zoom directo a la grilla)
        try {
          const bounds = grillaLayer.getBounds();
          if (bounds.isValid()) {
            map.fitBounds(bounds.pad(0.1)); // podés bajar el 0.1 si querés aún más cerca
          } else {
            map.setView(centroMoron, 15);
          }
        } catch (e) {
          console.warn('No se pudo ajustar vista a la grilla:', e);
          map.setView(centroMoron, 15);
        }
      })
      .catch(error => {
        console.error(error);
        // Fallback: centrar en Morón con zoom cercano
        map.setView(centroMoron, 15);
      });
  </script>

</body>
</html>
